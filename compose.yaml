# Local development: only PostgreSQL starts by default (the backend starts it automatically).
# Full stack:        docker compose --profile app up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studenthub
      POSTGRES_USER: studenthub
      POSTGRES_PASSWORD: studenthub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studenthub -d studenthub"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends during development; inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    profiles: [app]
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studenthub
      SPRING_DATASOURCE_USERNAME: studenthub
      SPRING_DATASOURCE_PASSWORD: studenthub
      # Optional locally; without it the backend uses a random key per start.
      JWT_SECRET: ${JWT_SECRET:-}
      STORAGE_DIR: /app/data/uploads
      MAIL_HOST: mailpit
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Optional: enables AI summaries and quizzes. Put it in a git-ignored .env file next to this one.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  uploads:
