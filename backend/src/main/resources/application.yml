spring:
  application:
    name: student-hub
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  mail:
    # Locally, Mailpit from compose.yaml catches every email (web inbox at http://localhost:8025).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  docker:
    compose:
      # Starts the PostgreSQL container from the root compose file when running locally.
      file: ../compose.yaml
      lifecycle-management: start-only

app:
  # Time zone of the university; weekly repeating events keep their local time across DST changes.
  time-zone: Europe/Warsaw
  jwt:
    # Base64 key of at least 256 bits; generate one with `openssl rand -base64 32`.
    # When unset, a random key is created at startup and sessions end on every restart.
    secret: ${JWT_SECRET:}
    issuer: student-hub
    ttl: 24h
  registration:
    allowed-email-domains: st.swps.edu.pl,swps.edu.pl
    # Base URL of the web app, used for links in emails.
    public-url: ${PUBLIC_URL:http://localhost:5173}
    verification-ttl: 24h
    resend-cooldown: 1m
  mail:
    from: ${MAIL_FROM:SWPS Hub <no-reply@swpshub.local>}
  ai:
    # Without a key the AI study tools are hidden. Get one at https://console.anthropic.com
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
    daily-limit: 20
    max-file-size: 20MB
  storage:
    # Uploaded materials. Mount a persistent volume here in production.
    local-dir: ${STORAGE_DIR:./data/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
